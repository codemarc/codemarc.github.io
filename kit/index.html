const GEN = /*GEN*/[{"name":"auth","group":"daily","groupTitle":"Every trading day","summary":"hours left on the 7-day Schwab login","about":"Reads the login from the Keychain and says how long it has. Under 24 hours it says to log in again today. Run it before any live command.","live":true,"human":false,"exit":{"0":"logged in (under 24 hours left still exits 0; the text says log in today)","2":"usage error, or the Keychain or a file failed","3":"no App Key and Secret (sk setup), or not logged in, or the 7-day login expired (sk login)"},"run":null,"output":null,"code":null},{"name":"glance","group":"daily","groupTitle":"Every trading day","summary":"the account on one line, then the Dow, Nasdaq, S&P 500 and Russell 2000","about":"One line: account value, cash, market value, day change, cost basis and gain or loss, then one line per index ($DJI, $COMPX, $SPX, $RUT) and the New York time. Day change is Schwab's Account Summary figure: the value now against the value at the start of the day, cash included, so the percent matches Schwab's screen. Market value and cost basis are rebuilt from the rows.","live":true,"human":false,"exit":{"0":"read","1":"rows plus cash differ from Schwab's value (stop and check)","2":"usage error, or the Keychain or a file failed","3":"Marc must sign in: no App Key and Secret (sk setup), or the login is missing, expired or refused (sk login)","4":"Schwab or the network failed: unreachable, an error status, a rate limit; try again in a minute"},"run":"sk glance file=fixtures/sample/schwab-account.json quotes=fixtures/sample/schwab-index-quotes.json now=\"2026-11-04 10:30\" format=text","output":"\n\nAccount $126,570.00 | cash $40,000.00 | market $86,570.00 | day -$1,250.00 (-0.98%) | cost $88,395.67 | gain -$1,825.67 (-2.07%)\n\n\nDJIA          48,000.00  -240.00  (-0.50%)\nNASDAQ        23,000.00  -115.00  (-0.50%)\nS&P 500        7,000.00   +35.00  (+0.50%)\nRussell 2000   2,500.00   -12.50  (-0.50%)\n\n\nTime (ET)     2026-11-04 10:30","code":0},{"name":"plan","group":"daily","groupTitle":"Every trading day","summary":"the day plan: your rules applied to today, written as a short narrative","about":"Today in a few readable sections: the session and its times, earnings around today and the freezes they cause, open dip swings and puts to settle first, which dip-universe names are eligible for a new swing and why the others are out, cash and how many swings it fits, how a swing runs, and a checklist. It picks no trade and decides nothing. format=md gives Markdown for a doc or a chat.","live":true,"human":false,"exit":{"0":"nothing to settle","1":"an open dip swing has an ACT line","2":"usage error, or the Keychain or a file failed","3":"Marc must sign in: no App Key and Secret (sk setup), or the login is missing, expired or refused (sk login)","4":"Schwab or the network failed: unreachable, an error status, a rate limit; try again in a minute"},"run":"sk plan file=fixtures/sample/schwab-account.json earnings=fixtures/sample/earnings.json dips=fixtures/sample/dips.json now=\"2026-11-04 10:30\" format=text","output":"DAY PLAN  Wednesday, November 4  (read only; picks no trade)\n\nWednesday, November 4. A full session, 9:30 to 4:00. AMD reports after today's close, so\nnew positions are frozen today and tomorrow. Being flat by 3:55 keeps tonight's report\nout of any swing. One name is eligible for a new swing today: META. Free cash fits 1\nswing at the $15,000.00 target. This plan applies your rules to the account; it does not\npick trades, and every decision stays yours.\n\nEARNINGS AROUND TODAY\n  AMD    Nov 4   AMC     held  no new positions today or tomorrow\n\nWHO IS ELIGIBLE FOR A NEW SWING\n  NVDA   out  a swing from Nov 4 is still open; a new one would stack on it\n  AMD    out  earnings blackout Oct 30 to Nov 5 (reports Nov 4 after the close)\n  META   yes  earnings Jan 27, clear of the blackout\n  AMZN   out  no earnings date on file, so the blackout cannot be proven clear\n  GOOGL  out  no earnings date on file, so the blackout cannot be proven clear\n  TSM    out  no earnings date on file, so the blackout cannot be proven clear\n  MSFT   out  no earnings date on file, so the blackout cannot be proven clear\n\nCASH\n  $40,000.00 cash, $20,000.00 held for open puts, $20,000.00 free: fits 1 swing(s) at\n  $15,000.00.\n\nHOW A SWING RUNS\n  1. No entries before 10:00.\n  2. Price and noise: the entry you would pay and the prior session's 5-minute ATR\n     (thinkorswim for now).\n  3. Size: sk size price=<entry> atr=<ATR> format=text. It sizes to $15,000.00, sets the\n     stop so the loss stays at or under $400.00, and checks the stop sits outside one\n     ATR of noise; failing that it tries the $13,000.00 band low, then SKIP. The band\n     wins over the stop.\n  4. Check: a limit buy with strategy dip-swing and its stop, through /rule-check.\n  5. Enter: /ticket gives the ladder, mid first, nickels toward the ask, never past the\n     checked limit.\n  6. Tag it once filled: sk dip symbol=<NAME>.\n\nDURING THE DAY\n  - Flat by 3:55. Start working exits around 3:45, limit at the mid walking down in\n    nickels.\n  - A stop hit means done for that name; a re-entry is a new swing, sized and checked\n    from scratch.\n  - Run sk review format=text once after 10:00 so option volume means something.\n  - Free cash is $20,000.00 after $20,000.00 held for open puts.\n\nCHECKLIST\n  [ ] Record earnings dates for AMZN, GOOGL, TSM and MSFT if you might trade them\n  [ ] 10:00: nothing enters before this\n  [ ] 10:15: sk review format=text\n  [ ] Each swing: sk size, /rule-check, /ticket, sk dip\n  [ ] 3:45: start exits; 3:55: flat\n  [ ] After the close: untag closed swings (sk dip symbol=<NAME> off=1)\n\nNot decided by this plan: whether to trade at all, which name, and what to do with open\nswings and puts. Those are yours; the plan only makes sure what you choose fits the\nrules you wrote.","code":0},{"name":"review","group":"daily","groupTitle":"Every trading day","summary":"the pre-trade look: ACT and WARN lines, calls, puts, best strikes, working orders","about":"One read-only look before any trade: account value and free cash; ACT and WARN lines for earnings, ex-dividend dates and dip swings; calls to watch; short puts; shares with no call and the best strike at or above basis on the next monthly expiry; working orders and what the rules say about them. Every candidate still goes through sk check before a ticket.","live":true,"human":false,"exit":{"0":"nothing needs a decision","1":"an ACT line","2":"usage error, or the Keychain or a file failed","3":"Marc must sign in: no App Key and Secret (sk setup), or the login is missing, expired or refused (sk login)","4":"Schwab or the network failed: unreachable, an error status, a rate limit; try again in a minute"},"run":"sk review file=fixtures/sample/schwab-account.json quotes=fixtures/sample/schwab-quotes.json chains=fixtures/sample/schwab-chains.json orders=fixtures/sample/schwab-orders.json earnings=fixtures/sample/earnings.json dips=fixtures/sample/dips.json now=\"2026-11-04 10:30\" format=text","output":"REVIEW 2026-11-04  (read only; nothing is sent)\nAccount $126,570.00   cash $40,000.00   put collateral $20,000.00   free $20,000.00\n\nNEEDS A LOOK\n  WARN  ex-dividend CME    310.00 call (2026-11-20) is 5.00 in the money and the stock goes ex-dividend 2026-11-12, before expiry. Time value left 1.50 vs dividend 1.25: early assignment possible\n\nCALLS TO WATCH\n  CME 2026-11-20 310.00 call x1: in the money by 5.00, time value left 1.50\n\nSHORT PUTS\n  AMD 2026-11-20 200.00 put x1: 10.00 above the strike; assignment takes $20,000.00 and makes 100 shares\n\nSHARES WITH NO CALL (2026-12-18, strikes at or above basis only)\n  SPCX   3 contract(s)  price 137.00  basis 145.87  best: 150.00 call, bid 3.00, volume 12, 18.2% annualized; earnings 2026-11-12 before expiry: the premium includes the report\n\nWORKING ORDERS (3)\n  DAY  SELL TO OPEN 1 SPCX 2026-12-18 140.00 call  limit 6.10  (working, entered 2026-11-04)\n  DAY  SELL 75 NVDA  trail 5%  (working, entered 2026-11-04)\n  GTC  BUY TO CLOSE 1 CME 2026-11-20 310.00 call  limit 3.25  (working, entered 2026-10-28)\n  ACT   #9000003 SPCX 2026-12-18 140.00 call: strike below the 145.87 basis, against the rule\n  WARN  #9000002 trailing stop becomes a market order when it triggers; fine for an exit, but the fill price is not controlled\n\nEvery candidate still goes through /rule-check before a ticket.","code":1},{"name":"orders","group":"daily","groupTitle":"Every trading day","summary":"orders at Schwab: working, filled, canceled, with rule warnings on working ones","about":"Lists orders entered in a date range, working ones first. On working orders it warns about market orders, stops that turn into market orders, and calls sold below basis. Schwab returns at most 60 days per request. Read only: sk cannot place, change or cancel an order.","live":true,"human":false,"exit":{"0":"no rule needs a decision","1":"an ACT warning on a working order","2":"usage error, or the Keychain or a file failed","3":"Marc must sign in: no App Key and Secret (sk setup), or the login is missing, expired or refused (sk login)","4":"Schwab or the network failed: unreachable, an error status, a rate limit; try again in a minute"},"run":"sk orders file=fixtures/sample/schwab-orders.json now=\"2026-11-04 10:30\" format=text","output":"WORKING (3)\n  2026-11-04  WORKING   DAY  SELL TO OPEN 1 SPCX 2026-12-18 140.00 call  limit 6.10  open 1  #9000003\n  2026-11-04  WORKING   DAY  SELL 75 NVDA  trail 5%  open 75  #9000002\n  2026-10-28  WORKING   GTC  BUY TO CLOSE 1 CME 2026-11-20 310.00 call  limit 3.25  open 1  #9000001\n\nRULES\n  WARN  #9000002 trailing stop becomes a market order when it triggers; fine for an exit, but the fill price is not controlled\n\nFILLED, CANCELED AND EXPIRED (2)\n  2026-10-30  CANCELED  DAY  BUY 25 NVDA  limit 195.00  #9000005\n  2026-10-21  FILLED    DAY  SELL TO OPEN 1 AMD 2026-11-20 200.00 put  limit 4.10  filled 1 at 4.10  #9000004\n\nRead only. sk cannot place, change or cancel an order.","code":0},{"name":"checks","group":"daily","groupTitle":"Every trading day","summary":"morning checks: earnings book against Schwab, ex-dividend risk, dip swings","about":"What the quote API knows that the positions read does not: earnings dates on file that are behind Schwab's last report, held symbols with no date (with an estimate to order the lookups), short calls in the money facing an ex-dividend date before expiry, and each tagged dip swing against the dip rules.","live":true,"human":false,"exit":{"0":"no ACT line","1":"an ACT line","2":"usage error, or the Keychain or a file failed","3":"Marc must sign in: no App Key and Secret (sk setup), or the login is missing, expired or refused (sk login)","4":"Schwab or the network failed: unreachable, an error status, a rate limit; try again in a minute"},"run":"sk checks file=fixtures/sample/schwab-account.json quotes=fixtures/sample/schwab-quotes.json earnings=fixtures/sample/earnings.json dips=fixtures/sample/dips.json now=\"2026-11-04 10:30\" format=text","output":"CHECKS 2026-11-04\nWARN  ex-dividend CME    310.00 call (2026-11-20) is 5.00 in the money and the stock goes ex-dividend 2026-11-12, before expiry. Time value left 1.50 vs dividend 1.25: early assignment possible\nok    dip         NVDA   75 shares, down $75.00, inside the dip rules\nok    earnings    AMD    reports 2026-11-04 AMC\nok    earnings    CME    reports 2027-02-04 BMO\nok    earnings    NVDA   reports 2026-11-19 AMC\nok    earnings    SPCX   reports 2026-11-12 AMC","code":0},{"name":"positions","group":"account","groupTitle":"The account and the market","summary":"every holding, grouped by underlying, totals rebuilt from the rows","about":"One block per underlying: shares, short calls and puts, value and basis, then each holding. Totals are rebuilt from the rows and set beside Schwab's liquidation value; a gap over $1.00 says st const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* Layered left-to-right layout: rank = longest path from a source; order by the mean order of predecessors. */
function layout(flow, W, H, rankGap, nodeGap) {
  const preds = new Map(flow.nodes.map((n) => [n.id, []]));
  for (const [a, b] of flow.edges) preds.get(b).push(a);
  const rank = new Map();
  const r = (id) => { if (!rank.has(id)) { rank.set(id, 0); rank.set(id, Math.max(0, ...preds.get(id).map((p) => r(p) + 1))); } return rank.get(id); };
  flow.nodes.forEach((n) => r(n.id));
  const ranks = [];
  flow.nodes.forEach((n, i) => { (ranks[rank.get(n.id)] ||= []).push({ id: n.id, i }); });
  const order = new Map();
  ranks.forEach((col) => {
    col.forEach((c) => { const ps = preds.get(c.id).filter((p) => order.has(p)); c.key = ps.length ? ps.reduce((t, p) => t + order.get(p), 0) / ps.length : c.i; });
    col.sort((a, b) => a.key - b.key || a.i - b.i);
    col.forEach((c, k) => order.set(c.id, k));
  });
  const tallest = Math.max(...ranks.map((c) => c.length));
  const height = tallest * H + (tallest - 1) * nodeGap;
  const pos = new Map();
  ranks.forEach((col, k) => {
    const h = col.length * H + (col.length - 1) * nodeGap;
    col.forEach((c, j) => pos.set(c.id, { x: k * (W + rankGap), y: (height - h) / 2 + j * (H + nodeGap) }));
  });
  return { pos, width: ranks.length * W + (ranks.length - 1) * rankGap, height };
}

function flowHtml(name, flow) {
  const H = 62, P = 4, avail = document.getElementById("view").clientWidth - 2 * P;
  const probe = layout(flow, 1, H, 0, 12), cols = probe.width;
  const gap = Math.max(22, Math.min(40, (avail - cols * 176) / Math.max(1, cols - 1)));
  const W = Math.max(118, Math.min(176, Math.floor((avail - (cols - 1) * gap) / cols)));
  const L = layout(flow, W, H, gap, 12);
  const edges = flow.edges.map(([a, b]) => {
    const s = L.pos.get(a), t = L.pos.get(b);
    const sx = s.x + W + P, sy = s.y + H / 2 + P, tx = t.x + P - 2, ty = t.y + H / 2 + P, mx = (sx + tx) / 2;
    return `<path d="M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}" fill="none" stroke="var(--stroke1)" stroke-width="1.25" marker-end="url(#arr-${name})"/>`;
  }).join("");
  const nodes = flow.nodes.map((n) => {
    const p = L.pos.get(n.id);
    return `<div class="node k-${n.kind}" style="left:${p.x + P}px;top:${p.y + P}px;width:${W}px;height:${H}px"><div class="l">${esc(n.label)}</div>${n.sub ? `<div class="s">${esc(n.sub)}</div>` : ""}</div>`;
  }).join("");
  const w = L.width + 2 * P, h = L.height + 2 * P;
  return `<div class="flow-wrap"><div class="flow" role="img" aria-label="How sk ${name} works: inputs, steps and outputs" style="width:${w}px;height:${h}px">
    <svg width="${w}" height="${h}"><defs><marker id="arr-${name}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--fg3)"/></marker></defs>${edges}</svg>${nodes}</div></div>
  <div class="legend small muted">${[["k-in","Reads"],["k-step","Step"],["k-decide","Rule or decision"],["k-write","Writes a file"],["k-out","Prints"]].map(([k, t]) => `<span><span class="sw ${k}"></span>${t}</span>`).join("")}</div>`;
}

function barsHtml(label, cats, vals, fmt, horizontal) {
  const max = Math.max(...vals);
  if (horizontal) {
    return `<div role="img" aria-label="${esc(label)}"><p class="small" style="font-weight:500;margin-bottom:8px">${esc(label)}</p>${cats.map((c, i) => `<div class="row" style="margin:4px 0"><span class="small muted" style="width:110px">${esc(c)}</span><span style="height:14px;width:${(vals[i] / max) * 60}%;background:var(--accent);border-radius:2px"></span><span class="small">${esc(fmt(vals[i]))}</span></div>`).join("")}</div>`;
  }
  const W = 640, Hc = 150, pad = 24, bw = Math.min(60, (W - 2 * pad) / cats.length - 16);
  const step = (W - 2 * pad) / cats.length;
  const bars = cats.map((c, i) => {
    const h = (vals[i] / max) * (Hc - 30), x = pad + i * step + (step - bw) / 2, y = Hc - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="var(--accent)"/><text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--fg2)">${esc(fmt(vals[i]))}</text><text x="${x + bw / 2}" y="${Hc + 16}" text-anchor="middle" font-size="11" fill="var(--fg3)">${esc(c)}</text>`;
  }).join("");
  return `<p class="small" style="font-weight:500;margin-bottom:6px">${esc(label)}</p><svg viewBox="0 0 ${W} ${Hc + 24}" width="100%" role="img" aria-label="${esc(label)}"><line x1="${pad}" x2="${W - pad}" y1="${Hc}" y2="${Hc}" stroke="var(--stroke2)"/>${bars}</svg>`;
}

function sizeDip(entry, atr) {
  const maxLoss = 40000, lo = 1300000, hi = 1800000, target = 1500000, maxShares = 299, steps = [];
  for (const [label, budget, up] of [["$15,000 target", target, false], ["$13,000 band low", lo, true]]) {
    const shares = Math.min(up ? Math.ceil(budget / entry) : Math.floor(budget / entry), maxShares);
    const dist = Math.floor(maxLoss / shares), notional = shares * entry, inside = dist <= atr;
    steps.push({ label, shares, notional, dist, inside });
    if (notional < lo || notional > hi || inside) continue;
    return { trade: true, shares, dist, stop: entry - dist, loss: shares * dist, steps };
  }
  return { trade: false, steps };
}

  </svg>` + tableHtml(["now=", "sk clock says"], [
    ["2026-11-04 09:45", "OPEN; fractional and dip entries not yet"],
    ["2026-11-04 10:15", "OPEN; fractional and dip entries allowed"],
    ["2026-11-04 16:30", "CLOSED"],
    ["2026-11-26 11:00", "CLOSED (NYSE holiday: Thanksgiving Day)"],
    ["2026-11-27 12:30", "OPEN, early close 13:00 (day after Thanksgiving)"],
  ]);
}

const dollars = (v) => "$" + v.toFixed(2);
const MECH = {
  review: () => stats([["$126,570.00", "Account value"], ["$40,000.00", "Cash"], ["−$20,000.00", "Put collateral (AMD 200 put)"], ["$20,000.00", "Free cash"]])
    + `<div style="margin-top:18px">${barsHtml("Best strike for the 300 uncovered SPCX (basis 145.87, Dec 18): time value on the bid", ["150 (vol 12)", "155 (vol 0)", "160 (vol 4)"], [3.0, 2.0, 1.2], dollars)}</div>
    <p class="small faint note">Only strikes at or above basis are considered; 155 never traded, so it is ignored. 150 wins. Strikes below basis (130–145) are never offered.</p>`,
  positions: () => stats([["$86,570.00", "Holdings, from the rows"], ["+ $40,000.00", "Cash"], ["= $126,570.00", "Rebuilt"], ["$126,570.00", "Schwab says: agrees", true]]),
  chain: () => barsHtml("SPCX Dec 18 calls: time value on the bid by strike (underlying 137.00)", ["130", "135", "140", "145", "150", "155", "160"], [4.5, 5.8, 5.7, 4.3, 3.0, 2.0, 1.2], dollars)
    + `<p class="small faint note">Time value peaks near the money. Every strike implies spot 137.00 by parity, matching Schwab's underlying, so no stop and check.</p>`,
  check: () => tableHtml(["Order", "What", "Verdict", "Why"], [
    ["cc-cme", "Sell 2 CME 280 calls @ 5.20", "PASS", "covered, at or above basis"],
    ["cc-msft-below-basis", "Sell 2 MSFT 400 calls @ 9.00", "BLOCK", "strike 400.00 below basis 410.00; also WARN: earnings before expiry"],
    ["dip-nvda", "Buy 82 NVDA @ 182.40", "PASS", "inside the dip rules"],
    ["exit-msft-market", "Sell 10 MSFT at market", "PASS", "WARN limit-only: an exit is never blocked"],
  ], { tones: ["success", "danger", "success", "warning"] }),
  ticket: () => `<div class="grid2">${ladderHtml({ title: "Sell 2 CME 280 calls, limit 5.20", side: "SELL", bid: 5.2, ask: 5.5, mid: 5.35, rungs: [5.35, 5.3, 5.25, 5.2], limit: 5.2, lo: 5.12, hi: 5.58 })}${ladderHtml({ title: "Buy 82 NVDA, limit 182.40", side: "BUY", bid: 182.3, ask: 182.42, mid: 182.36, rungs: [182.35, 182.4], limit: 182.4, lo: 182.26, hi: 182.46 })}</div>`,
  size: () => `<div id="size">${sizeHtml()}</div>`,
  pick: () => barsHtml("CME Nov 20 calls that traded on Oct 26: time value on the bid (spot 307.45 from parity)", ["300.00", "310.00", "312.50", "315.00"], [4.15, 6.5, 5.5, 4.5], dollars)
    + `<p class="small faint note">297.50, 302.50, 305.00 and 307.50 had no volume and are ignored. 310 wins with 6.50. Source: fixtures/real/cme-2026-10-26.json.</p>`,
  yield: () => stats([["5.20", "Premium (bid)"], ["÷ 280.00", "Collateral"], ["× 365 ÷ 15", "Sep 3 to Sep 18"], ["= 45.2%", "Annualized", true]]),
  parity: () => stats([["7.10", "Call mid"], ["− 6.95", "Put mid"], ["+ 280.00", "Strike"], ["= 280.15", "Spot", true]]),
  clock: clockHtml,
  earnings: () => barsHtml("Days to the next report in the sample book, as of 2026-11-04", ["SPCX (AMC)", "NVDA (AMC)", "CME (BMO)"], [8, 15, 92], (v) => `${v} days`, true)
    + `<div class="callout">AMD is held but has no date on file, so sk earnings exits 1 and the review shows it as a WARN.</div>`,
  auth: () => `<div role="img" aria-label="The 7-day login: 144 hours fine, the last 24 hours say log in again today" style="display:flex;height:14px;border-radius:3px;overflow:hidden"><div style="flex:144;background:var(--fill1)"></div><div style="flex:24;background:var(--amber)"></div></div>
    <div class="row small muted" style="justify-content:space-between;margin-top:6px"><span>sk login: 168 hours</span><span>last 24: "log in again today"</span></div>`,
  glance: () => stats([["$126,570.00", "Account value"], ["$127,820.00", "Start of the day"], ["−$1,250.00", "Day change (−0.98%)"], ["−$1,825.67", "Gain on cost (−2.07%)"]]),
  help: () => stats([["26", "Commands"], ["56", "Examples"], ["29", "Run by bun test"], ["≤ 40", "Lines in the index"]]),
};

function where(g) {
  if (g.human) return "Marc runs it at the terminal: it prompts. An agent asks him to and never asks for what it takes.";
  if (g.name === "auth" || g.name === "accounts") return "Reads the Keychain; no offline form.";
  return g.live ? "Calls Schwab, or runs on saved responses (file=, quotes=, chains=, orders=)." : "Runs on files and arguments only; never calls Schwab.";
}

function render(name) {
  const g = GEN.find((x) => x.name === name) || GEN.find((x) => x.name === "review") || GEN[0];
  if (!g) return;
  document.querySelectorAll("nav button.pill").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cmd === g.name)));
  const mech = MECH[g.name];
  const heading = g.name === "size" ? "Try it" : g.name === "help" ? "What it covers" : "The numbers";
  const out = g.output !== null && g.run
    ? `<div class="card"><div class="card-h"><span>What it printed on the sample</span><span class="tag">exit ${g.code}</span></div><div class="card-b"><pre class="cmd">$ ${esc(g.run)}</pre>${outputHtml(g.output)}</div></div>`
    : TEMPLATES[g.name] ? `<div class="card"><div class="card-h"><span>What it says (message shapes from the code)</span><span class="tag">no account data</span></div><div class="card-b">${outputHtml(TEMPLATES[g.name])}</div></div>` : "";
  document.getElementById("view").innerHTML = `
    <h2>sk ${esc(g.name)}</h2>
    <p class="lead">${esc(g.summary)}</p>
    <p class="muted" style="margin-top:4px">${esc(g.about)}</p>
    <p class="small faint" style="margin-top:4px">${esc(where(g))}</p>
    ${FLOWS[g.name] ? `<h3>How it works</h3><div id="flowbox" data-cmd-flow="${g.name}">${flowHtml(g.name, FLOWS[g.name])}</div>` : ""}
    ${mech ? `<h3>${heading}</h3>${mech()}` : ""}
    ${out}
    <h3>Exit codes</h3>${tableHtml(["Code", "Means"], Object.entries(g.exit), { align: ["right", "left"] })}`;
}

function nav() {
  const groups = [];
  for (const g of GEN) {
    const last = groups[groups.length - 1];
    if (last && last.title === g.groupTitle) last.names.push(g.name); else groups.push({ title: g.groupTitle, names: [g.name] });
  }
  document.getElementById("nav").innerHTML = groups.map((grp) => `<div class="group"><span class="group-title">${esc(grp.title)}</span><span class="pills">${grp.names.map((n) => `<button class="pill" data-cmd="${n}" aria-pressed="false">${n}</button>`).join("")}</span></div>`).join("");
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.themeSet) setTheme(b.dataset.themeSet);
  if (b.dataset.cmd) { history.replaceState(null, "", "#" + b.dataset.cmd); render(b.dataset.cmd); }
  if (b.dataset.atr) { atr = Number(b.dataset.atr); document.getElementById("size").innerHTML = sizeHtml(); }
});
window.addEventListener("hashchange", () => render(location.hash.slice(1)));
let resizing;
window.addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => {
    const box = document.getElementById("flowbox");
    if (box) box.innerHTML = flowHtml(box.dataset.cmdFlow, FLOWS[box.dataset.cmdFlow]);
  }, 120);
});

function setTheme(t) {
  if (t === "dark") document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("sk-theme", t); } catch (e) {}
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
}
setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

nav();
render(location.hash.slice(1) || "review");
const v = GEN.find((x) => x.name === "version");
document.getElementById("foot").textContent = `Generated from ${v && v.output ? v.output : "sk"}, on the synthetic sample in fixtures/sample. Read only: sk cannot place, change or cancel an order.`;
</script>
</body>
</html>
